<div class="container-fluid my-5 px-5">

  <!-- CARGANDO -->
  <div
    *ngIf="cargando"
    class="text-center py-5"
  >
    <div
      class="spinner-border text-primary"
      role="status"
    >
      <span class="visually-hidden">
        Cargando...
      </span>
    </div>
  </div>

  <!-- CONTENIDO -->
  <div
    *ngIf="!cargando && item"
    class="card shadow-lg border-0 rounded-4 overflow-hidden"
  >

    <!-- CABECERA -->
    <div
      class="card-header d-flex justify-content-between align-items-center py-3"
      style="
        background: linear-gradient(90deg, #0d6efd, #0b5ed7);
        color: white;
        border-bottom: 4px solid #ff9800;
      "
    >
      <h3 class="m-0 fw-bold">
        <i class="bi bi-box-seam me-2"></i>
        Detalle de Entrega
      </h3>

      <button
        class="btn btn-light rounded-pill px-4"
        (click)="back()"
      >
        <i class="bi bi-arrow-left me-2"></i>
        Volver
      </button>
    </div>

    <!-- CUERPO -->
    <div class="card-body bg-light">

      <!-- PERSONA -->
      <div
        class="card detalle-card border-0 shadow-sm mb-4"
      >
        <div class="card-body">

          <h5 class="detalle-titulo">
            <i class="bi bi-person-badge me-2"></i>
            Persona que recibió
          </h5>

          <div class="row g-3">

            <div class="col-lg-3 col-md-6">
              <label class="form-label">
                DNI
              </label>

              <input
                type="text"
                class="form-control"
                [value]="item.dni || '-'"
                readonly
              />
            </div>

            <div class="col-lg-3 col-md-6">
              <label class="form-label">
                Apellido
              </label>

              <input
                type="text"
                class="form-control"
                [value]="item.apellido || '-'"
                readonly
              />
            </div>

            <div class="col-lg-3 col-md-6">
              <label class="form-label">
                Nombre
              </label>

              <input
                type="text"
                class="form-control"
                [value]="item.nombre || '-'"
                readonly
              />
            </div>

            <div class="col-lg-3 col-md-6">
              <label class="form-label">
                Unidad
              </label>

              <input
                type="text"
                class="form-control"
                [value]="item.nombreUnidad || '-'"
                readonly
              />
            </div>

          </div>
        </div>
      </div>

      <!-- EQUIPO -->
      <div
        class="card detalle-card border-0 shadow-sm mb-4"
      >
        <div class="card-body">

          <h5 class="detalle-titulo">
            <i class="bi bi-broadcast-pin me-2"></i>
            Equipo entregado
          </h5>

          <div class="row g-3">

            <div class="col-lg-3 col-md-6">
              <label class="form-label">
                ID Policial
              </label>

              <input
                type="text"
                class="form-control equipo-principal"
                [value]="item.idPolicial || '-'"
                readonly
              />
            </div>

            <div class="col-lg-3 col-md-6">
              <label class="form-label">
                Tipo
              </label>

              <input
                type="text"
                class="form-control"
                [value]="item.tipoEquipo || '-'"
                readonly
              />
            </div>

            <div class="col-lg-3 col-md-6">
              <label class="form-label">
                Marca
              </label>

              <input
                type="text"
                class="form-control"
                [value]="item.marca || '-'"
                readonly
              />
            </div>

            <div class="col-lg-3 col-md-6">
              <label class="form-label">
                Modelo
              </label>

              <input
                type="text"
                class="form-control"
                [value]="item.modelo || '-'"
                readonly
              />
            </div>

            <div class="col-lg-6 col-md-6">
              <label class="form-label">
                Número de serie
              </label>

              <input
                type="text"
                class="form-control"
                [value]="item.nroSerie || '-'"
                readonly
              />
            </div>

            <div class="col-lg-6 col-md-6">
              <label class="form-label">
                IMEI
              </label>

              <input
                type="text"
                class="form-control"
                [value]="item.imei || '-'"
                readonly
              />
            </div>

          </div>
        </div>
      </div>

      <!-- ENTREGA -->
      <div
        class="card detalle-card border-0 shadow-sm mb-4"
      >
        <div class="card-body">

          <h5 class="detalle-titulo">
            <i class="bi bi-clipboard-check me-2"></i>
            Datos de la entrega
          </h5>

          <div class="row g-3">

            <div class="col-lg-4 col-md-6">
              <label class="form-label">
                Fecha de entrega
              </label>

              <input
                type="text"
                class="form-control"
                [value]="
                  item.fechaEntrega
                    ? (item.fechaEntrega | date:'dd/MM/yyyy HH:mm')
                    : '-'
                "
                readonly
              />
            </div>

            <div class="col-lg-4 col-md-6">
              <label class="form-label">
                Estado del equipo
              </label>

              <div class="estado-box">

                <span
                  *ngIf="item.estadoDetalle === 1"
                  class="badge bg-warning text-dark"
                >
                  ENTREGADO
                </span>

                <span
                  *ngIf="item.estadoDetalle === 2"
                  class="badge bg-success"
                >
                  RECEPCIONADO
                </span>

                <span
                  *ngIf="item.estadoDetalle === 3"
                  class="badge bg-danger"
                >
                  ANULADO
                </span>

                <span
                  *ngIf="
                    item.estadoDetalle !== 1 &&
                    item.estadoDetalle !== 2 &&
                    item.estadoDetalle !== 3
                  "
                  class="badge bg-secondary"
                >
                  SIN ESTADO
                </span>

              </div>
            </div>

            <div class="col-lg-4 col-md-6">
              <label class="form-label">
                Fecha de recepción
              </label>

              <input
                type="text"
                class="form-control"
                [value]="
                  item.fechaRecepcionDetalle
                    ? (item.fechaRecepcionDetalle | date:'dd/MM/yyyy HH:mm')
                    : '-'
                "
                readonly
              />
            </div>

            <div class="col-lg-4 col-md-6">
              <label class="form-label">
                Estado general de la planilla
              </label>

              <div class="estado-box">

                <span
                  *ngIf="item.estadoPlanilla === 1"
                  class="badge bg-warning text-dark"
                >
                  ENTREGA PENDIENTE
                </span>

                <span
                  *ngIf="item.estadoPlanilla === 2"
                  class="badge bg-success"
                >
                  ENTREGA COMPLETA
                </span>

                <span
                  *ngIf="item.estadoPlanilla === 3"
                  class="badge bg-info text-dark"
                >
                  RECEPCIÓN PARCIAL
                </span>

                <span
                  *ngIf="item.estadoPlanilla === 4"
                  class="badge bg-danger"
                >
                  ANULADA
                </span>

              </div>
            </div>

            <div class="col-lg-4 col-md-6">
              <label class="form-label">
                Fecha recepción planilla
              </label>

              <input
                type="text"
                class="form-control"
                [value]="
                  item.fechaRecepcionPlanilla
                    ? (item.fechaRecepcionPlanilla | date:'dd/MM/yyyy HH:mm')
                    : '-'
                "
                readonly
              />
            </div>

            <div class="col-lg-4 col-md-6">
              <label class="form-label">
                Usuario que recepcionó
              </label>

              <input
                type="text"
                class="form-control"
                [value]="
                  item.usuarioRecibeDetalle != null
                    ? item.usuarioRecibeDetalle
                    : '-'
                "
                readonly
              />
            </div>

            <div class="col-12">
              <label class="form-label">
                Observación de entrega
              </label>

              <textarea
                class="form-control"
                rows="3"
                readonly
              >{{ item.observacionEntrega || '-' }}</textarea>
            </div>

            <div class="col-12">
              <label class="form-label">
                Observación del equipo
              </label>

              <textarea
                class="form-control"
                rows="3"
                readonly
              >{{ item.observacion || '-' }}</textarea>
            </div>

          </div>
        </div>
      </div>

      <!-- DATOS ANULACION -->
      <div
        *ngIf="item.estadoDetalle === 3"
        class="card detalle-card border-0 shadow-sm mb-4"
      >
        <div class="card-body">

          <h5 class="detalle-titulo text-danger">
            <i class="bi bi-x-octagon me-2"></i>
            Datos de anulación
          </h5>

          <div class="row g-3">

            <div class="col-lg-6 col-md-6">
              <label class="form-label">
                Usuario que anuló
              </label>

              <input
                type="text"
                class="form-control"
                [value]="
                  item.usuarioAnula != null
                    ? item.usuarioAnula
                    : '-'
                "
                readonly
              />
            </div>

            <div class="col-lg-6 col-md-6">
              <label class="form-label">
                Fecha de anulación
              </label>

              <input
                type="text"
                class="form-control"
                [value]="
                  item.fechaAnulacion
                    ? (item.fechaAnulacion | date:'dd/MM/yyyy HH:mm')
                    : '-'
                "
                readonly
              />
            </div>

          </div>
        </div>
      </div>

      <!-- ACCIONES -->
      <div
        class="d-flex justify-content-end gap-3 flex-wrap"
      >

        <button
          class="btn btn-secondary px-4"
          (click)="back()"
        >
          <i class="bi bi-arrow-left me-2"></i>
          Volver
        </button>

        <button
          *ngIf="item.estadoDetalle === 1"
          class="btn btn-success px-4"
          (click)="recepcionar()"
        >
          <i class="bi bi-check-circle me-2"></i>
          Recepcionar
        </button>

        <button
          *ngIf="item.estadoDetalle === 1"
          class="btn btn-danger px-4"
          (click)="anular()"
        >
          <i class="bi bi-x-circle me-2"></i>
          Anular entrega
        </button>

      </div>

    </div>
  </div>

  <!-- NO ENCONTRADO -->
  <div
    *ngIf="!cargando && !item"
    class="text-center py-5"
  >
    <i
      class="bi bi-exclamation-circle fs-1 text-secondary"
    ></i>

    <h5 class="mt-3">
      No se encontró la entrega
    </h5>

    <button
      class="btn btn-primary mt-3 px-4"
      (click)="back()"
    >
      Volver
    </button>
  </div>

</div>
