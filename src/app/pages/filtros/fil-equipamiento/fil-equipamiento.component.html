<div class="card filtro-panel shadow-sm my-4">
  <div class="row g-3 align-items-end">
    <!-- Registros -->
    <div class="col-lg-2 col-md-3">
      <label class="form-label filtro-label"> Registros </label>

      <select
        class="form-select filtro-input"
        [(ngModel)]="limit"
        (change)="filter()"
      >
        <option *ngFor="let c of limits" [ngValue]="c">
          {{ c }}
        </option>
      </select>
    </div>

    <!-- Marca -->
    <div class="col-lg-2 col-md-3">
      <label class="form-label filtro-label"> Marca </label>

      <select
        class="form-select filtro-input"
        [(ngModel)]="idMarca"
        (change)="cambioMarca()"
      >
        <option [ngValue]="null">Todas</option>

        <option *ngFor="let item of marcas" [ngValue]="item.id">
          {{ item.nombre }}
        </option>
      </select>
    </div>

    <!-- Modelo -->

    <div class="col-lg-2 col-md-3">
      <label class="form-label filtro-label"> Modelo </label>

      <select
        class="form-select filtro-input"
        [(ngModel)]="idModelo"
        (change)="filter()"
      >
        <option [ngValue]="null">Todos</option>

        <option *ngFor="let item of modelos" [ngValue]="item.idModelo">
          {{ item.modelo }} - {{ item.marca }}
        </option>
      </select>
    </div>

    <!-- Tipo -->

    <div class="col-lg-2 col-md-3">
      <label class="form-label filtro-label"> Tipo Equipo </label>

      <select
        class="form-select filtro-input"
        [(ngModel)]="idTipoEquipo"
        (change)="filter()"
      >
        <option [ngValue]="null">Todos</option>

        <option *ngFor="let item of tipos" [ngValue]="item.idTipoEquipo">
          {{ item.nombre }}
        </option>
      </select>
    </div>

    <!-- Estado -->

    <div class="col-lg-2 col-md-3">
      <label class="form-label filtro-label"> Estado </label>

      <select
        class="form-select filtro-input"
        [(ngModel)]="idEstado"
        (change)="filter()"
      >
        <option [ngValue]="null">Todos</option>

        <option *ngFor="let item of estados" [ngValue]="item.idEstado">
          {{ item.nombre }}
        </option>
      </select>
    </div>

    <!-- Buscar -->

    <div class="col-lg-12">
      <label class="form-label filtro-label"> Buscar </label>

      <div class="input-group">
        <input
          class="form-control filtro-input"
          placeholder="Marca, modelo, serie, IMEI, identificación..."
          [(ngModel)]="busqueda"
          (ngModelChange)="filter()"
        />

        <span class="input-group-text filtro-buscar-icon">
          <i class="bi bi-search"></i>
        </span>
      </div>
    </div>
  </div>

  <hr />

  <div class="d-flex justify-content-center align-items-center gap-3">
    <button
      class="btn btn-outline-primary filtro-nav-btn"
      [disabled]="paginaActual <= 1"
      (click)="setPage(paginaActual, 'anterior')"
    >
      <i class="bi bi-chevron-left"></i>
    </button>

    <div class="filtro-nav-info">
      Página {{ paginaActual }}

      de

      {{ totalPaginas }}

      <span> {{ totalRegistros }} registros </span>
    </div>

    <button
      class="btn btn-outline-primary filtro-nav-btn"
      [disabled]="paginaActual >= totalPaginas"
      (click)="setPage(paginaActual, 'siguiente')"
    >
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>
