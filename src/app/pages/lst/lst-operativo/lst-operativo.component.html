<div class="container-fluid my-5 px-5">
  <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
    <!-- CABECERA -->
    <div
      class="card-header d-flex justify-content-between align-items-center py-3"
      style="
        background: linear-gradient(90deg, #0d6efd, #0b5ed7);
        color: white;
        border-bottom: 4px solid #ff9800;
      "
    >
      <h3 class="m-0 fw-bold">
        <i class="bi bi-broadcast me-2"></i>
        Listado de Operativos
      </h3>

      <button
        *ngIf="puedeOperar()"
        class="btn btn-light rounded-pill px-4"
        (click)="linkear(0)"
      >
        <i class="bi bi-plus-circle me-2"></i>
        Agregar
      </button>
    </div>

    <!-- CUERPO -->

    <div class="card-body bg-light">
      <app-fil-operativo (emmit)="doFound($event)"></app-fil-operativo>

      <div class="table-responsive rounded-4 shadow-sm bg-white">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-primary text-center">
            <tr>
              <th class="text-start">Denominación</th>

              <th width="150">Estado</th>

              <th width="170">Acciones</th>
            </tr>
          </thead>

          <tbody>
            <tr *ngFor="let item of items">
              <td class="fw-semibold">
                {{ item.denominacion }}
              </td>

              <td class="text-center">
                <span
                  class="badge px-3 py-2"
                  [ngClass]="item.activo ? 'bg-success' : 'bg-secondary'"
                >
                  {{ item.activo ? "Activo" : "Cerrado" }}
                </span>
              </td>

              <td class="text-center">
                <button
                  *ngIf="puedeOperar()"
                  class="btn btn-outline-primary btn-sm rounded-pill me-2"
                  (click)="linkear(item.idOperativo)"
                  title="Editar"
                >
                  <i class="bi bi-pencil-square"></i>
                </button>
                <!-- Equipamientos -->
                <button
                  *ngIf="puedeOperar()"
                  class="btn btn-outline-success btn-sm rounded-pill me-2"
                  (click)="equipamientos(item.idOperativo)"
                  title="Administrar Equipamientos"
                >
                  <i class="bi bi-broadcast-pin"></i>
                </button>
                <button
                  *ngIf="puedeOperar() && item.activo"
                  class="btn btn-outline-warning btn-sm rounded-pill me-2"
                  (click)="cerrarOperativo(item)"
                  title="Cerrar Operativo"
                >
                  <i class="bi bi-lock"></i>
                </button>
                <button
                  *ngIf="puedeEliminar()"
                  class="btn btn-outline-danger btn-sm rounded-pill"
                  (click)="eliminar(item.idOperativo)"
                  title="Eliminar"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>

            <tr *ngIf="items.length == 0">
              <td colspan="3" class="text-center py-5">
                <i class="bi bi-inbox fs-1 text-secondary d-block mb-2"></i>

                <h5 class="text-secondary">No se encontraron registros</h5>

                <small class="text-muted">
                  Intente modificar los filtros o agregue un nuevo operativo.
                </small>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- FOOTER -->

    <div class="card-footer text-end text-muted small bg-white fw-semibold">
      Total: {{ items.length }} registros
    </div>
  </div>
</div>
