<div class="container-fluid my-5 px-5">
  <div class="card shadow-lg border-0 rounded-4 overflow-hidden">

    <!-- CABECERA -->
    <div
      class="card-header d-flex justify-content-between align-items-center py-3"
      style="
        background: linear-gradient(90deg, #0d6efd, #0b5ed7);
        color: #f8f9fa;
        border-bottom: 4px solid #ff9800;
      "
    >
      <h3 class="m-0 fw-bold d-flex align-items-center">
        <i class="bi bi-check2-circle me-2" style="color:#ffe9c2"></i>
        Listado de Estados
      </h3>

      <button
        *ngIf="puedeOperar()"
        class="btn btn-light rounded-pill px-4 fw-semibold"
        (click)="linkear(0)"
      >
        <i class="bi bi-plus-circle me-2"></i>
        Agregar
      </button>
    </div>

    <!-- CUERPO -->
    <div class="card-body bg-light py-4">

      <!-- FILTRO -->
      <div class="d-flex flex-wrap align-items-end gap-3 mb-4">
        <app-fil-estado
          (emmit)="doFound($event)"
          class="flex-grow-1"
        ></app-fil-estado>
      </div>

      <!-- TABLA -->
      <div class="table-responsive rounded-4 shadow-sm bg-white w-100">
        <table class="table table-hover align-middle mb-0">

          <thead class="table-primary text-center">
            <tr>
              <th class="text-start">Nombre</th>
              <th>Estado</th>
              <th width="180">Acciones</th>
            </tr>
          </thead>

          <tbody>

            <tr *ngFor="let item of items">

              <td class="fw-semibold">
                {{item.nombre}}
              </td>

              <td class="text-center">

                <span
                  class="badge px-3 py-2"
                  [ngClass]="item.activo ? 'bg-success':'bg-secondary'"
                >
                  {{item.activo ? 'Activo':'Inactivo'}}
                </span>

              </td>

              <td class="text-center">

                <button
                  *ngIf="puedeOperar()"
                  class="btn btn-outline-primary btn-sm rounded-pill me-2"
                  (click)="linkear(item.idEstado)"
                >
                  <i class="bi bi-pencil-square"></i>
                </button>

                <button
                  *ngIf="puedeEliminar()"
                  class="btn btn-outline-danger btn-sm rounded-pill"
                  (click)="eliminar(item.idEstado)"
                >
                  <i class="bi bi-trash"></i>
                </button>

              </td>

            </tr>

            <tr *ngIf="items.length==0">

              <td colspan="3" class="text-center py-5">

                <i class="bi bi-inbox fs-1 text-secondary"></i>

                <h5 class="mt-3">
                  No se encontraron registros
                </h5>

                <small class="text-muted">
                  Ajuste los filtros o agregue un nuevo estado.
                </small>

              </td>

            </tr>

          </tbody>

        </table>
      </div>

    </div>

    <div class="card-footer text-end bg-white fw-semibold">

      Total: {{items.length}} registros

    </div>

  </div>
</div>
